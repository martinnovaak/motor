[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motor-trainer"
version = "0.1.0"
description = "CUDA-first NNUE trainer for Motor"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "schedulefree>=1.4",
    "torch>=2.2",
]

[project.scripts]
motor-train = "motor_trainer.train:main"
motor-train-corrhist-material = "motor_trainer.corrhist_material_train:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["motor_trainer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
